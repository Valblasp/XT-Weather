name: Build and Release XT Weather

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'tools/**'
      - 'version.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pillow

    - name: Build XT Weather packages
      run: |
        python build_both.py

    - name: Read version
      id: ver
      run: |
        VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.ver.outputs.version }}"
        name: "XT Weather v${{ steps.ver.outputs.version }}"
        body: |
          Automatic build of XT Weather v${{ steps.ver.outputs.version }}!
          - Auto-update support
          - Launch auto-refresh
          - Home button exit
        files: |
          ../xteink-weather-app/xtweather.xtapp
          ../xteink-weather-app/xtweatherland.xtapp
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
